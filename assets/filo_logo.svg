<svg width="600" height="300" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .wordmark { font-family: -apple-system,'Helvetica Neue',Arial,sans-serif; font-size: 64px; font-weight: 200; letter-spacing: 14px; fill: #1A2B5C; }
      .tagline { font-family: -apple-system,'Helvetica Neue',Arial,sans-serif; font-size: 11px; font-weight: 400; letter-spacing: 4px; fill: #7A9ABB; }
      .icolabel { font-family: -apple-system,'Helvetica Neue',Arial,sans-serif; font-size: 9px; font-weight: 500; letter-spacing: 2px; }
    </style>
  </defs>

  <!-- Anelli ornamentali -->
  <circle cx="150" cy="150" r="100" fill="none" stroke="#3B6FE8" stroke-width="0.5" opacity="0.15"/>
  <circle cx="150" cy="150" r="94" fill="none" stroke="#3B6FE8" stroke-width="0.5" opacity="0.08"/>

  <!-- Sfondo icona -->
  <circle cx="150" cy="150" r="86" fill="#EDF2FF" opacity="0.55"/>

  <!-- Raggi -->
  <line x1="150" y1="122" x2="150" y2="82" stroke="#3B6FE8" stroke-width="1.5" opacity="0.35"/>
  <line x1="178" y1="150" x2="218" y2="150" stroke="#6DB89A" stroke-width="1.5" opacity="0.35"/>
  <line x1="150" y1="178" x2="150" y2="218" stroke="#5B9BD5" stroke-width="1.5" opacity="0.35"/>
  <line x1="122" y1="150" x2="82" y2="150" stroke="#3B6FE8" stroke-width="1.5" opacity="0.35"/>

  <!-- Tacche sui raggi -->
  <line x1="147" y1="100" x2="153" y2="100" stroke="#3B6FE8" stroke-width="1" opacity="0.25"/>
  <line x1="200" y1="147" x2="200" y2="153" stroke="#6DB89A" stroke-width="1" opacity="0.25"/>
  <line x1="147" y1="200" x2="153" y2="200" stroke="#5B9BD5" stroke-width="1" opacity="0.25"/>
  <line x1="100" y1="147" x2="100" y2="153" stroke="#3B6FE8" stroke-width="1" opacity="0.25"/>

  <!-- Gomitolo centrale -->
  <circle cx="150" cy="150" r="20" fill="#ffffff" stroke="#3B6FE8" stroke-width="1.5"/>
  <circle cx="150" cy="150" r="14" fill="none" stroke="#3B6FE8" stroke-width="1.2" opacity="0.45"/>
  <circle cx="150" cy="150" r="8" fill="none" stroke="#6DB89A" stroke-width="1.2" opacity="0.6"/>
  <circle cx="150" cy="150" r="3" fill="#3B6FE8"/>

  <!-- NORD: Calendar -->
  <circle cx="150" cy="64" r="24" fill="#ffffff" stroke="#3B6FE8" stroke-width="1.8"/>
  <rect x="139" y="55" width="22" height="18" rx="3" fill="#EDF2FF" stroke="#3B6FE8" stroke-width="1.2"/>
  <line x1="143" y1="55" x2="143" y2="51" stroke="#3B6FE8" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="157" y1="55" x2="157" y2="51" stroke="#3B6FE8" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="139" y1="61" x2="161" y2="61" stroke="#3B6FE8" stroke-width="1"/>
  <rect x="143" y="64" width="4" height="4" rx="1" fill="#3B6FE8" opacity="0.7"/>
  <rect x="150" y="64" width="4" height="4" rx="1" fill="#3B6FE8" opacity="0.4"/>
  <text x="150" y="99" text-anchor="middle" class="icolabel" fill="#3B6FE8">CALENDAR</text>

  <!-- EST: Task -->
  <circle cx="236" cy="150" r="24" fill="#ffffff" stroke="#6DB89A" stroke-width="1.8"/>
  <rect x="225" y="139" width="18" height="18" rx="3" fill="#EAF7F1" stroke="#6DB89A" stroke-width="1.2"/>
  <path d="M229 148 L233 153 L242 143" fill="none" stroke="#6DB89A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="236" y="185" text-anchor="middle" class="icolabel" fill="#6DB89A">TASK</text>

  <!-- SUD: Note -->
  <circle cx="150" cy="236" r="24" fill="#ffffff" stroke="#5B9BD5" stroke-width="1.8"/>
  <rect x="139" y="225" width="18" height="20" rx="3" fill="#EAF3FF" stroke="#5B9BD5" stroke-width="1.2"/>
  <line x1="143" y1="231" x2="153" y2="231" stroke="#5B9BD5" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="143" y1="236" x2="153" y2="236" stroke="#5B9BD5" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="143" y1="241" x2="149" y2="241" stroke="#5B9BD5" stroke-width="1.1" stroke-linecap="round"/>
  <text x="150" y="271" text-anchor="middle" class="icolabel" fill="#5B9BD5">NOTE</text>

  <!-- OVEST: Mail -->
  <circle cx="64" cy="150" r="24" fill="#ffffff" stroke="#3B6FE8" stroke-width="1.8"/>
  <rect x="51" y="140" width="26" height="18" rx="3" fill="#EDF2FF" stroke="#3B6FE8" stroke-width="1.2"/>
  <path d="M51 143 L64 151 L77 143" fill="none" stroke="#3B6FE8" stroke-width="1.5" stroke-linecap="round"/>
  <text x="64" y="185" text-anchor="middle" class="icolabel" fill="#3B6FE8">MAIL</text>

  <!-- Wordmark -->
  <text x="308" y="167" class="wordmark">Filo</text>
  <text x="313" y="193" class="tagline">il tuo filo conduttore</text>
</svg>
